<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Настройка — DayZ Panel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🛠</text></svg>">

  <!--
    Страница отдаётся до входа (только с localhost), поэтому, как и страница
    входа, она самодостаточная и не тянет файлы интерфейса панели.
  -->
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #131a22;
      --surface2: #0f151c;
      --line: #1f2a35;
      --text: #dbe4ee;
      --dim: #8b9bab;
      --acc: #3fb950;
      --warn: #d29922;
      --danger: #e5484d;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1400px 700px at 50% -20%, #16212c 0%, var(--bg) 60%);
      color: var(--text);
      padding: 28px 20px 80px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(160deg, #1d2b38, #16202a);
      border: 1px solid var(--line);
    }
    h1 { font-size: 18px; margin: 0; }
    .sub { font-size: 12.5px; color: var(--dim); margin-top: 3px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 22px;
      margin-top: 18px;
    }
    .card > h2 { font-size: 14.5px; margin: 0 0 4px; }
    .card > .hint { font-size: 12.5px; color: var(--dim); margin: 0 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
    .fhint { font-size: 11.5px; color: var(--dim); margin-top: 5px; opacity: 0.85; }
    input[type=text], input[type=password], input[type=number], select, textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      font-family: inherit;
    }
    textarea { min-height: 130px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    input:focus, select:focus, textarea:focus { border-color: #2f6f3f; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--acc); }
    .row label { margin: 0; color: var(--text); font-size: 13.5px; }
    .secret-note { font-size: 11.5px; color: var(--dim); margin-top: 5px; }
    button {
      padding: 10px 16px;
      font-size: 13.5px;
      color: var(--text);
      background: #1b2530;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
    }
    button:hover { border-color: #33475c; }
    button.primary { background: #1f6f34; border-color: #2b8a44; }
    button.small { padding: 6px 11px; font-size: 12.5px; }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: rgba(11, 15, 20, 0.94);
      border-top: 1px solid var(--line);
      padding: 12px 20px;
      display: flex; align-items: center; gap: 14px;
      backdrop-filter: blur(6px);
    }
    .bar .grow { flex: 1; font-size: 12.5px; color: var(--dim); }
    .list { display: grid; gap: 8px; }
    .item { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--dim); }
    .dot.ok { background: var(--acc); }
    .dot.warn { background: var(--warn); }
    .dot.fail { background: var(--danger); }
    .dot.off { background: #46545f; }
    .item .why { color: var(--dim); font-size: 12px; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .nav a { font-size: 12.5px; color: var(--dim); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; }
    .nav a:hover { color: var(--text); border-color: #33475c; }
    .blocked { font-size: 12.5px; color: var(--warn); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { text-align: left; color: var(--dim); font-weight: 500; padding: 0 8px 8px 0; }
    td { padding: 4px 8px 4px 0; vertical-align: top; }
    .msg { font-size: 13px; margin-top: 12px; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--acc); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark">🛠</div>
      <div>
        <h1>Настройка панели</h1>
        <div class="sub" id="sub">Открывается только на этой машине.</div>
      </div>
    </div>

    <div id="root"></div>
  </div>

  <div class="bar">
    <div class="grow" id="state"></div>
    <button class="small" id="reload">Обновить</button>
    <button class="primary" id="save">Сохранить всё</button>
  </div>

  <script type="module" src="/js/setup.js"></script>
</body>
</html>
