<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Вход — DayZ Panel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧟</text></svg>">

  <!--
    Страница входа намеренно самодостаточная: она отдаётся до проверки ключа,
    поэтому не тянет ни один файл интерфейса панели.
  -->
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #131a22;
      --line: #1f2a35;
      --text: #dbe4ee;
      --dim: #8b9bab;
      --acc: #3fb950;
      --danger: #e5484d;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #16212c 0%, var(--bg) 60%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(160deg, #1d2b38, #16202a);
      border: 1px solid var(--line);
    }
    h1 { font-size: 17px; margin: 0; }
    .sub { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
    label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 17px;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
      background: #0e141b;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    input:focus { border-color: var(--acc); }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      color: #06210c;
      background: var(--acc);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .note {
      margin-top: 20px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--dim);
      background: #0e141b;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .err {
      margin-top: 14px;
      padding: 11px 13px;
      font-size: 13px;
      color: #ffd7d8;
      background: rgba(229, 72, 77, 0.12);
      border: 1px solid rgba(229, 72, 77, 0.4);
      border-radius: 10px;
      display: none;
    }
    .warn {
      margin-top: 14px;
      padding: 11px 13px;
      font-size: 12.5px;
      color: #ffe6b0;
      background: rgba(240, 180, 41, 0.1);
      border: 1px solid rgba(240, 180, 41, 0.35);
      border-radius: 10px;
      display: none;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="mark">🧟</div>
    <div>
      <h1>DayZ Panel</h1>
      <div class="sub">вход по мастер-ключу</div>
    </div>
  </div>

  <form id="form" autocomplete="off">
    <label for="key">Мастер-ключ</label>
    <input id="key" name="key" placeholder="XXXX-XXXX-XXXX" maxlength="14" autofocus
           inputmode="text" spellcheck="false">
    <button type="submit" id="go">Войти</button>
  </form>

  <div class="err" id="err"></div>
  <div class="warn" id="warn"></div>

  <div class="note">
    Ключи печатаются в окне панели при её запуске — там же, где адрес и порт.
    Они <b>новые при каждом запуске</b> панели, поэтому старый ключ после
    перезапуска не подойдёт. Сессия держится <span id="hours">12</span> ч.
  </div>
</div>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('key');
  const button = document.getElementById('go');
  const err = document.getElementById('err');
  const warn = document.getElementById('warn');

  // Ключ приятнее вводить без дефисов — расставим их сами.
  input.addEventListener('input', () => {
    const clean = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
    input.value = (clean.match(/.{1,4}/g) || []).join('-');
  });

  fetch('/api/auth/status')
    .then((r) => r.json())
    .then((s) => {
      document.getElementById('hours').textContent = s.sessionHours;
      if (s.authenticated) return (location.href = '/');
      if (!s.https && !s.loopback) {
        warn.style.display = 'block';
        warn.innerHTML =
          'Соединение без HTTPS: ключ передаётся по сети открытым текстом. Для доступа из интернета ' +
          'поставьте панель за reverse-proxy с сертификатом или укажите <code>panel.tls</code> в настройках.';
      }
    })
    .catch(() => {});

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    err.style.display = 'none';
    button.disabled = true;
    button.textContent = 'Проверяю…';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: input.value })
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) throw new Error(data.error || `Ошибка ${response.status}`);
      location.href = '/';
    } catch (error) {
      err.textContent = error.message;
      err.style.display = 'block';
      input.select();
    } finally {
      button.disabled = false;
      button.textContent = 'Войти';
    }
  });
</script>

</body>
</html>
