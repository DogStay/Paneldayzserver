<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Вход — DayZ Panel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧟</text></svg>">

  <!--
    Страница входа намеренно самодостаточная: она отдаётся до проверки ключа,
    поэтому не тянет ни один файл интерфейса панели.
  -->
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #131a22;
      --line: #1f2a35;
      --text: #dbe4ee;
      --dim: #8b9bab;
      --acc: #3fb950;
      --danger: #e5484d;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 600px at 50% -10%, #16212c 0%, var(--bg) 60%);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .mark {
      width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center; font-size: 22px;
      background: linear-gradient(160deg, #1d2b38, #16202a);
      border: 1px solid var(--line);
    }
    h1 { font-size: 17px; margin: 0; }
    .sub { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
    label { display: block; font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 17px;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--text);
      background: #0e141b;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    input:focus { border-color: var(--acc); }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      font-size: 14px;
      font-weight: 600;
      color: #06210c;
      background: var(--acc);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .note {
      margin-top: 20px;
      padding: 12px 14px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--dim);
      background: #0e141b;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .err {
      margin-top: 14px;
      padding: 11px 13px;
      font-size: 13px;
      color: #ffd7d8;
      background: rgba(229, 72, 77, 0.12);
      border: 1px solid rgba(229, 72, 77, 0.4);
      border-radius: 10px;
      display: none;
    }
    .warn {
      margin-top: 14px;
      padding: 11px 13px;
      font-size: 12.5px;
      color: #ffe6b0;
      background: rgba(240, 180, 41, 0.1);
      border: 1px solid rgba(240, 180, 41, 0.35);
      border-radius: 10px;
      display: none;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="mark">🧟</div>
    <div>
      <h1>DayZ Panel</h1>
      <div class="sub" id="mode-sub">вход в панель</div>
    </div>
  </div>

  <!-- Вход логином и паролем -->
  <form id="form-login" autocomplete="on">
    <label for="login">Логин</label>
    <input id="login" name="login" autocapitalize="none" spellcheck="false" autocomplete="username" autofocus>
    <label for="password" style="margin-top:10px">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit" id="go">Войти</button>
  </form>

  <!-- Регистрация или создание владельца при первом запуске -->
  <form id="form-register" autocomplete="on" style="display:none">
    <label for="r-name">Как вас зовут</label>
    <input id="r-name" spellcheck="false" autocomplete="name">
    <label for="r-login" style="margin-top:10px">Логин</label>
    <input id="r-login" autocapitalize="none" spellcheck="false" autocomplete="username">
    <label for="r-password" style="margin-top:10px">Пароль <span style="opacity:.6">(от 8 знаков)</span></label>
    <input id="r-password" type="password" autocomplete="new-password">

    <div id="key-field" style="display:none">
      <label for="r-key" style="margin-top:10px">Мастер-ключ из окна панели</label>
      <input id="r-key" placeholder="XXXX-XXXX-XXXX" maxlength="14" spellcheck="false">
    </div>

    <button type="submit" id="go-register">Создать аккаунт</button>
  </form>

  <button type="button" id="discord" style="display:none;margin-top:10px;background:#5865f2">
    Войти через Discord
  </button>

  <div class="err" id="err"></div>
  <div class="warn" id="warn"></div>

  <div class="note" id="note">
    <a href="#" id="to-register" style="color:#8fc3ff">Зарегистрироваться</a>
    <span id="to-login-wrap" style="display:none">
      <a href="#" id="to-login" style="color:#8fc3ff">Войти в существующий аккаунт</a>
    </span>
    <div style="margin-top:8px">Сессия держится <span id="hours">12</span> ч.</div>
  </div>
</div>

<script>
  /*
   * Страница входа. Три случая:
   *   1) в панели ещё нет аккаунтов — создаём владельца, для этого нужен
   *      мастер-ключ из окна панели (иначе владельцем стал бы любой прохожий);
   *   2) обычный вход логином и паролем или через Discord;
   *   3) регистрация, если владелец её включил.
   */
  const err = document.getElementById('err');
  const warn = document.getElementById('warn');
  const formLogin = document.getElementById('form-login');
  const formRegister = document.getElementById('form-register');

  let state = { setup: false, registration: false, discord: false };

  const show = (node, on) => (node.style.display = on ? '' : 'none');

  function fail(message) {
    err.textContent = message;
    show(err, Boolean(message));
  }

  function mode(which) {
    show(formLogin, which === 'login');
    show(formRegister, which === 'register');
    show(document.getElementById('discord'), state.discord && which === 'login');
    show(document.getElementById('to-register'), which === 'login' && (state.registration || state.setup));
    show(document.getElementById('to-login-wrap'), which === 'register' && !state.setup);

    document.getElementById('mode-sub').textContent =
      which === 'register' ? (state.setup ? 'первый запуск: создайте владельца' : 'регистрация') : 'вход в панель';
    document.getElementById('go-register').textContent = state.setup ? 'Стать владельцем панели' : 'Создать аккаунт';
    show(document.getElementById('key-field'), state.setup);
  }

  async function loadState() {
    try {
      const res = await fetch('/api/auth/status');
      const data = await res.json();

      state.setup = Boolean(data.setup);
      state.registration = Boolean(data.registration);
      state.discord = Boolean(data.discord);
      document.getElementById('hours').textContent = data.sessionHours || 12;

      if (data.insecure) {
        warn.innerHTML =
          'Соединение без HTTPS: пароль пойдёт по сети открытым текстом. ' +
          'Для доступа из интернета включите TLS или поставьте reverse-proxy.';
        show(warn, true);
      }
    } catch (_) {
      /* панель ответит на попытке входа */
    }

    // Ошибку из перехода Discord показываем сразу.
    const params = new URLSearchParams(location.search);
    if (params.get('error')) fail(params.get('error'));

    mode(state.setup ? 'register' : 'login');
  }

  async function send(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Ошибка ${res.status}`);
    return data;
  }

  formLogin.addEventListener('submit', async (event) => {
    event.preventDefault();
    fail('');

    const button = document.getElementById('go');
    button.disabled = true;
    try {
      await send('/api/auth/login/password', {
        login: document.getElementById('login').value.trim(),
        password: document.getElementById('password').value
      });
      location.href = '/';
    } catch (e) {
      fail(e.message);
      button.disabled = false;
    }
  });

  formRegister.addEventListener('submit', async (event) => {
    event.preventDefault();
    fail('');

    const button = document.getElementById('go-register');
    button.disabled = true;
    try {
      const result = await send('/api/auth/register', {
        name: document.getElementById('r-name').value.trim(),
        login: document.getElementById('r-login').value.trim(),
        password: document.getElementById('r-password').value,
        key: document.getElementById('r-key').value.trim()
      });

      if (result.pending) {
        formRegister.style.display = 'none';
        warn.textContent = 'Аккаунт создан и ждёт подтверждения владельцем панели.';
        show(warn, true);
        return;
      }
      location.href = '/';
    } catch (e) {
      fail(e.message);
      button.disabled = false;
    }
  });

  document.getElementById('discord').addEventListener('click', () => {
    location.href = '/api/auth/discord/start';
  });

  document.getElementById('to-register').addEventListener('click', (e) => {
    e.preventDefault();
    mode('register');
  });
  document.getElementById('to-login').addEventListener('click', (e) => {
    e.preventDefault();
    mode('login');
  });

  loadState();
</script>

</body>
</html>
